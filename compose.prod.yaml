name: nabz

services:
  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      APP_ENV: production
      MOCK_MODE: "false"
      NABZ_ENABLE_DEMO: "false"
      NABZ_ENABLE_API_DOCS: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in .env.production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      NABZ_ADMIN_IDENTIFIERS: ${NABZ_ADMIN_IDENTIFIERS:?Set the owner email or phone in .env.production}
      NABZ_TEXT_MODEL: ${NABZ_TEXT_MODEL:-qwen3.7-plus}
      NABZ_OPENAI_FALLBACK_MODEL: ${NABZ_OPENAI_FALLBACK_MODEL:-gpt-4o}
      NABZ_REGISTERED_AI_BUDGET_USD: ${NABZ_REGISTERED_AI_BUDGET_USD:-1.00}
      NABZ_GUEST_AI_BUDGET_USD: ${NABZ_GUEST_AI_BUDGET_USD:-0.30}
      NABZ_AI_MAX_OUTPUT_TOKENS: ${NABZ_AI_MAX_OUTPUT_TOKENS:-4096}
      NABZ_OPENAI_REASONING_EFFORT: ${NABZ_OPENAI_REASONING_EFFORT:-none}
      NABZ_QWEN_INPUT_USD_PER_M: ${NABZ_QWEN_INPUT_USD_PER_M:-0.40}
      NABZ_QWEN_CACHED_INPUT_USD_PER_M: ${NABZ_QWEN_CACHED_INPUT_USD_PER_M:-0.08}
      NABZ_QWEN_OUTPUT_USD_PER_M: ${NABZ_QWEN_OUTPUT_USD_PER_M:-1.60}
      NABZ_OPENAI_INPUT_USD_PER_M: ${NABZ_OPENAI_INPUT_USD_PER_M:-2.50}
      NABZ_OPENAI_CACHED_INPUT_USD_PER_M: ${NABZ_OPENAI_CACHED_INPUT_USD_PER_M:-1.25}
      NABZ_OPENAI_OUTPUT_USD_PER_M: ${NABZ_OPENAI_OUTPUT_USD_PER_M:-10.00}
      NABZ_VL_MODEL: ${NABZ_VL_MODEL:-qwen3.7-plus}
      NABZ_VL_OCR_FALLBACK: ${NABZ_VL_OCR_FALLBACK:-qwen-vl-ocr}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      NABZ_DISABLE_NOMINATIM: ${NABZ_DISABLE_NOMINATIM:-1}
      NABZ_STORAGE_BACKEND: ${NABZ_STORAGE_BACKEND:?Set NABZ_STORAGE_BACKEND=s3 in .env.production}
      NABZ_S3_BUCKET: ${NABZ_S3_BUCKET:?Set NABZ_S3_BUCKET in .env.production}
      NABZ_S3_REGION: ${NABZ_S3_REGION:-}
      NABZ_S3_ENDPOINT_URL: ${NABZ_S3_ENDPOINT_URL:-}
      NABZ_S3_SSE: ${NABZ_S3_SSE:-AES256}
      NABZ_READINESS_CHECK_S3: ${NABZ_READINESS_CHECK_S3:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    expose:
      - "8000"
    volumes:
      - nabz-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  nabz-data:
