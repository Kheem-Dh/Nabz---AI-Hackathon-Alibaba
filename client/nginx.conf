server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    # API and browser both enforce a 25 MB medical-upload limit. Keep a small
    # multipart allowance here so Nginx never rejects an otherwise valid file.
    client_max_body_size 27m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self)" always;
    # frame-ancestors only takes effect via a real HTTP header (browsers
    # silently ignore it in a <meta> tag) — X-Frame-Options above already
    # covers the same protection for older browsers, this covers modern ones.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://nabz-api.onrender.com; media-src 'self' https://nabz-api.onrender.com blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # FastAPI documentation is disabled in production. Explicitly prevent SPA
    # fallback from making these paths appear to exist on the public origin.
    location = /docs { return 404; }
    location ^~ /docs/ { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
